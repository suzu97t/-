<title>キキガキ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 野帳（フィールドノート）の見開き。左で聞き取り、右の方眼ノートに書き留める。上にマップのステップ列。 */
:root{
  --paper:#EDF0EC;
  --sheet:#FAFBF8;
  --ink:#1C2628;
  --ink-2:#435053;
  --ink-3:#6B787A;
  --rule:#D2DAD4;
  --grid:rgba(44,74,128,.075);
  --ai:#2C4A80;
  --ai-ink:#FFFFFF;
  --ai-soft:#E1E8F3;
  --fork:#B93C28;
  --fork-soft:#F6E1DB;
  --hypo:#8A5F06;
  --hypo-soft:#F4EACD;
  --hypo-line:#C2942A;
  --ok:#2C6A4B;
  --ok-soft:#DAEBDF;
  --shadow:0 1px 0 rgba(28,38,40,.04), 0 8px 22px -14px rgba(28,38,40,.22);
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111617; --sheet:#192021; --ink:#E3E9E5; --ink-2:#B2BDBA; --ink-3:#85928E; --rule:#2D393A; --grid:rgba(143,168,224,.07);
    --ai:#93ACE6; --ai-ink:#0E1730; --ai-soft:#21304A;
    --fork:#F08A72; --fork-soft:#3A2420;
    --hypo:#E6BB5C; --hypo-soft:#362D1C; --hypo-line:#B48C34;
    --ok:#7FC79F; --ok-soft:#1D3327;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111617; --sheet:#192021; --ink:#E3E9E5; --ink-2:#B2BDBA; --ink-3:#85928E; --rule:#2D393A; --grid:rgba(143,168,224,.07);
  --ai:#93ACE6; --ai-ink:#0E1730; --ai-soft:#21304A;
  --fork:#F08A72; --fork-soft:#3A2420;
  --hypo:#E6BB5C; --hypo-soft:#362D1C; --hypo-line:#B48C34;
  --ok:#7FC79F; --ok-soft:#1D3327;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.75;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
h1,h2,h3,h4{text-wrap:balance;word-break:auto-phrase;font-feature-settings:"palt"}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--ink-3);font-weight:500}
.display{font-family:var(--font-display);font-weight:700;font-size:clamp(23px,3.2vw,33px);line-height:1.45;letter-spacing:.02em;margin:0}
.lead{font-size:16px;color:var(--ink-2);max-width:40em}
.muted{color:var(--ink-3)}
.hint{font-size:12px;color:var(--ink-3);line-height:1.6}
.center{text-align:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;line-height:1.3;border-radius:999px;padding:9px 18px;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ai);color:var(--ai-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{background:var(--rule);color:var(--ink-3);cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.ghost:disabled{color:var(--ink-3);cursor:not-allowed}
.btn.small{font-size:12.5px;padding:5px 12px;font-weight:500}
.btn.wide{width:100%}
.linkbtn{background:none;border:0;padding:2px 0;font-size:12.5px;color:var(--ai);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;white-space:nowrap}
.linkbtn:disabled{color:var(--ink-3);cursor:default;text-decoration:none}
.htag{display:inline-block;font-family:var(--font-mono);font-size:10.5px;color:var(--hypo);border:1px dashed var(--hypo-line);border-radius:4px;padding:0 5px;line-height:1.6;vertical-align:middle;margin-left:6px;white-space:nowrap;font-weight:500;letter-spacing:0}
body.notes-off .htag{display:none}

/* inputs */
input[type="text"],textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 12px;width:100%}
input[type="text"]:focus,textarea:focus{border-color:var(--ai);outline:none;box-shadow:0 0 0 3px var(--ai-soft)}
textarea{resize:vertical;line-height:1.7}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule)}
.appbar-in{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:var(--ink);text-decoration:none}
.seal{display:inline-grid;place-items:center;width:28px;height:28px;border:1.5px solid var(--fork);color:var(--fork);font-family:var(--font-display);font-weight:700;font-size:16px;border-radius:4px;transform:rotate(-4deg);flex:none}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.1em}
.brand-sub{color:var(--ink-3);font-size:12px}
.viewswitch{display:flex;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:3px}
.viewswitch a{padding:5px 14px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap}
.viewswitch a[aria-current="page"]{background:var(--ink);color:var(--sheet)}
@media (max-width:760px){.brand-sub{display:none}.viewswitch .long{display:none}}

/* rail */
.railhead{display:flex;justify-content:space-between;align-items:center;gap:6px 16px;flex-wrap:wrap;padding-top:14px}
.railtitle{font-size:12.5px;color:var(--ink-2);font-weight:500}
.railtools{display:flex;gap:16px;flex-wrap:wrap}
.rail{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.rail button{display:block;width:100%;text-align:left;border:0;background:transparent;border-top:3px solid var(--rule);padding:7px 2px 2px;color:var(--ink-3);font-size:12px;line-height:1.45;cursor:pointer}
.rail button:disabled{cursor:default}
.rail .num{display:block;font-family:var(--font-mono);font-size:11px}
.rail .done button{border-top-color:var(--ink-3);color:var(--ink-2)}
.rail .cur button{border-top-color:var(--ai);color:var(--ink);font-weight:700}
.rail .cur .num{color:var(--ai)}
@media (max-width:760px){.rail{display:flex;overflow-x:auto;scrollbar-width:none}.rail li{flex:0 0 7.2em}}
.why{margin-top:10px;padding:10px 14px;border:1px dashed var(--hypo-line);border-radius:var(--r);background:var(--sheet);font-size:13px;line-height:1.65}
.why-k{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.why-k .tag{font-size:11px;letter-spacing:.12em;color:var(--hypo);font-weight:700}
.why-k a{margin-left:auto;font-size:12.5px;color:var(--ai)}
.why dl{margin:0;display:grid;gap:3px}
.why dl>div{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:10px}
.why dt{color:var(--ink-3);font-size:12px;padding-top:1px}
.why dd{margin:0;color:var(--ink-2)}
@media (max-width:560px){.why dl>div{grid-template-columns:1fr;gap:0}}

/* invite */
.invite{padding-block:28px 64px;display:grid;gap:30px}
.letter{display:grid;gap:12px;max-width:48rem}
.from{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ai-soft);color:var(--ai);font-weight:700;font-size:13px;flex:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--rule)}
.fact{padding:18px 20px 18px 0;display:grid;gap:6px;align-content:start}
.fact+.fact{padding-left:20px;border-left:1px solid var(--rule)}
.fact h2{font-size:12px;letter-spacing:.12em;color:var(--ink-3);margin:0;font-weight:500}
.fact .big{font-family:var(--font-display);font-size:22px;font-weight:700}
.person{display:flex;gap:10px;align-items:center}
.person b{font-size:16px}
.fine{font-size:12.5px;color:var(--ink-3)}
@media (max-width:760px){.facts{grid-template-columns:1fr}.fact,.fact+.fact{padding:14px 0;border-left:0}.fact+.fact{border-top:1px solid var(--rule)}}
.sample-wrap{display:grid;grid-template-columns:minmax(0,17rem) minmax(0,1fr);gap:24px;align-items:start}
.sample-note{display:grid;gap:8px}
.sample-note h2{font-family:var(--font-display);font-size:19px;margin:0}
.sample-note p{color:var(--ink-2);font-size:14px}
.gridsheet{background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.gridsheet .caption{font-size:12px;color:var(--ink-3);margin-bottom:8px}
@media (max-width:760px){.sample-wrap{grid-template-columns:1fr}}
.cta-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--ai-soft);font-size:14px}
.banner p{flex:1 1 16em;min-width:0}
.livesetup{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:20px;display:grid;gap:14px;max-width:46rem}
.livesetup h2{font-family:var(--font-display);font-size:20px;margin:0}
.livesetup .intro{font-size:14px;color:var(--ink-2)}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.field-row{grid-template-columns:1fr}}
.avail{font-size:12.5px;color:var(--ink-2);padding:8px 12px;border-radius:8px;background:var(--paper)}
.avail.no{color:var(--fork)}

/* interview */
.interview{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:20px;padding-block:16px 40px;align-items:start}
.talk{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.talk-head{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--rule);font-size:12.5px;color:var(--ink-2)}
.talk-head .session{font-weight:700;color:var(--ink)}
.talk-head .theme{min-width:0}
.talk-head .elapsed{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.talk-head .spacer{flex:1 1 auto}
.modechip{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--paper);color:var(--ink-2);border:1px solid var(--rule)}
.modechip.live{background:var(--ai-soft);color:var(--ai);border-color:transparent}
.log{padding:18px 20px;display:flex;flex-direction:column;gap:16px;max-height:min(62vh,640px);min-height:320px;overflow-y:auto}
.msg .who{font-size:11px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:2px}
.msg.ai{border-left:2px solid var(--ai);padding-left:14px}
.msg.ai .q{font-family:var(--font-display);font-size:17px;line-height:1.85;font-weight:500;white-space:pre-line}
.msg.me{align-self:flex-end;max-width:88%;background:var(--paper);border-radius:12px 12px 3px 12px;padding:9px 14px}
.msg.me p{white-space:pre-line}
.msg.sys{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.sys-k{flex:none;font-size:10.5px;letter-spacing:.08em;color:var(--ok);border:1px solid var(--ok);border-radius:4px;padding:0 5px;line-height:1.7}
.divider{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink-3)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--rule)}
.ans{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.ans li{display:flex;gap:8px;align-items:baseline}
.ans .fixline{display:block;color:var(--ink-2)}
.v{flex:none;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;line-height:1.8}
.v-yes{background:var(--ok-soft);color:var(--ok)}
.v-partly{background:var(--hypo-soft);color:var(--hypo)}
.v-no{background:transparent;color:var(--ink-3);border:1px solid var(--rule)}
.hypos{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.hypo{border:1px dashed var(--hypo-line);background:var(--hypo-soft);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.hypo.is-yes{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.hypo.is-no{background:transparent;border-color:var(--rule)}
.hypo.is-no .ht{color:var(--ink-3)}
.ht{font-size:14.5px;line-height:1.7}
.hn{font-family:var(--font-mono);font-size:11px;color:var(--hypo);margin-right:8px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);overflow:hidden;justify-self:start}
.seg button{border:0;background:transparent;padding:5px 13px;font-size:13px;color:var(--ink-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button:hover{background:var(--paper)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.seg.big button{padding:8px 18px;font-size:14px;font-weight:500}
.fix{display:grid;gap:4px;font-size:12px;color:var(--ink-2)}
.fix input{background:var(--sheet)}
.hypo-send{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
.scale{display:grid;gap:8px;margin-top:12px}
.composer{border-top:1px solid var(--rule);padding:12px 16px 14px;display:grid;gap:8px}
.composer textarea{min-height:86px;font-size:15px}
.composer .row{display:flex;gap:8px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.composer .row .hint{flex:1 1 16em}
.composer .btns{display:flex;gap:8px;flex-wrap:wrap}
.composer .hint.center{padding:8px 0}
.pause{background:var(--paper)}
.pause-title{font-family:var(--font-display);font-weight:700;font-size:16px}
.pause label{font-size:12.5px;color:var(--ink-2)}
.pause input{background:var(--sheet)}
.typing{display:flex;align-items:center;gap:5px;color:var(--ink-3);font-size:13px;padding:6px 0}
.typing .d{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite ease-in-out}
.typing .d:nth-child(2){animation-delay:.15s}.typing .d:nth-child(3){animation-delay:.3s}
.typing .t{margin-left:6px}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.err{color:var(--fork);font-size:13.5px}
.mtabs{display:none}

/* note */
.note{background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;border:1px solid var(--rule);border-radius:var(--r);padding:14px 18px 20px;display:grid;gap:20px;min-width:0}
.note-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:8px}
.note-head h2{font-family:var(--font-display);font-size:17px;margin:0;letter-spacing:.06em}
.note-stats{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.note h3{font-size:11.5px;letter-spacing:.14em;color:var(--ink-3);font-weight:500;margin:0 0 6px}
.day-title{font-family:var(--font-display);font-size:18px;font-weight:700}
.day-sub{font-size:13.5px;color:var(--ink-2)}
.timeline{list-style:none;margin:10px 0 0;padding:0}
.ev{display:grid;grid-template-columns:3.3em 16px minmax(0,1fr);gap:8px;align-items:start;font-size:14px;line-height:1.65}
.ev time{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:3px}
.rail-col{position:relative;align-self:stretch;display:flex;justify-content:center}
.rail-col::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--rule)}
.ev:first-child .rail-col::before{top:10px}
.ev:last-child .rail-col::before{bottom:calc(100% - 12px)}
.dot{position:relative;width:9px;height:9px;border-radius:50%;background:var(--ink-3);margin-top:8px;border:2px solid var(--sheet);box-sizing:content-box}
.ev.fork .dot{width:9px;height:9px;border-radius:1px;transform:rotate(45deg);background:var(--fork)}
.ev p{padding:2px 0 8px}
.fork-tag{color:var(--fork);font-size:11.5px;font-weight:700;margin-left:6px;white-space:nowrap}
.empty-note{font-size:13px;color:var(--ink-3);border:1px dashed var(--rule);border-radius:8px;padding:10px 12px;background:var(--sheet)}
.cardlist{display:grid;gap:10px}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
.lg-fork{color:var(--fork)}
.lg-ai{border-bottom:1.5px dotted var(--hypo-line)}

/* card */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:grid;gap:8px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.card-no{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.card h4{margin:0;font-family:var(--font-display);font-size:16px;font-weight:700;flex:1 1 12em;min-width:0;line-height:1.55}
.cert{font-size:11.5px;padding:0 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap;line-height:1.8}
.cert.unset{border-style:dashed;color:var(--hypo);border-color:var(--hypo-line)}
.ifthen{margin:0;display:grid;gap:3px}
.ifthen>div{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:8px}
.ifthen dt{font-family:var(--font-display);font-weight:700;color:var(--ai);font-size:13.5px;padding-top:1px}
.ifthen dd{margin:0;font-size:14.5px}
.ifthen ul{margin:0;padding-left:1.1em}
.ifthen .empty{color:var(--ink-3);font-size:13px}
.sub{display:grid;gap:4px}
.sub-label{font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:6px;background:var(--ok-soft);line-height:1.6}
.chip.not{background:transparent;border:1px solid var(--rule);color:var(--ink-2)}
.chip.not::before{content:"× ";color:var(--ink-3)}
.pitfall{font-size:13.5px;background:var(--fork-soft);border-radius:6px;padding:5px 10px}
.quote{margin:0;font-family:var(--font-display);font-size:14.5px;color:var(--ink-2);border-left:2px solid var(--ink-3);padding-left:10px;line-height:1.7}
.quote cite{font-style:normal;font-family:var(--font-body);font-size:11.5px;color:var(--ink-3);margin-left:6px;white-space:nowrap}
.card-foot{font-size:12px;color:var(--hypo)}
.aim{background:transparent;color:inherit;border-bottom:1.5px dotted var(--hypo-line);padding:0 1px;border-radius:2px}
.aim[data-action]{cursor:pointer}
.aim sup{font-family:var(--font-mono);font-size:10px;color:var(--hypo);margin-left:1px}
@keyframes freshbg{from{background-color:var(--hypo-soft)}to{background-color:transparent}}

.next{font-family:var(--font-display);font-size:17px;line-height:1.7}
.peek summary{cursor:pointer;font-size:13px;color:var(--ai);margin-bottom:10px}

.bar span{display:block;height:100%;background:var(--ok);transition:width .3s}

.qitem{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:13.5px}
.qitem.open{border-color:var(--hypo-line);background:var(--hypo-soft)}
.qitem.done{display:flex;gap:8px;align-items:baseline;color:var(--ink-2);font-size:12.5px;padding:6px 12px}
.qcheck{color:var(--ok);font-weight:700}
.qhead{display:flex;gap:8px;align-items:baseline}
.qhead .linkbtn{margin-left:auto}

.qcard{font-size:11.5px;color:var(--ink-3)}

.qnote{color:var(--ink-2)}
.qact,.qfix .row{display:flex;gap:8px;flex-wrap:wrap}

.qfix input{background:var(--sheet)}
.handoff{border-top:1px solid var(--rule);padding-top:12px;display:grid;gap:8px}
.handoff h3{font-size:12px;letter-spacing:.14em;color:var(--ink-3);font-weight:500;margin:0}

/* done */

.done-list li+li{border-top:1px solid var(--rule)}
.copybox{font-family:var(--font-mono);font-size:12px;min-height:180px;background:var(--sheet)}
.status{font-size:12.5px;color:var(--ok)}

/* map */

.map-meta{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}

.map .mname{font-family:var(--font-display);font-size:15px}
.map .rowh{position:sticky;left:0;z-index:2;width:9.5em;background:var(--paper);font-size:12.5px;font-weight:700}
.map .corner{font-size:11px;color:var(--ink-3);font-weight:500}

.ideal{display:block}

.gap{display:block;color:var(--fork)}

.map th.goal-h{width:15em}

.hlist{list-style:none;margin:0;padding:0;display:grid;gap:0;border-block:1px solid var(--rule)}

.hlist li+li{border-top:1px solid var(--rule)}
.hlist .hid{font-family:var(--font-mono);font-size:12px;color:var(--hypo)}
.hlist .hsteps{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}

.checks .mk{font-weight:700;color:var(--ok)}
.checks .mk.manual{color:var(--hypo)}
.checks .cd{display:block;font-size:12px;color:var(--ink-3)}
.map-foot{padding-block:18px 64px}

@media (max-width:760px){

  .mtabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:6px;justify-content:center;align-items:center}

  .log{max-height:none;min-height:0;padding:14px 14px}
  .msg.ai .q{font-size:16px}
  .msg.me{max-width:94%}
}
@media (prefers-reduced-motion:reduce){
  .typing .d,.ev.fresh p,.day-title.fresh,.card.fresh-card,.pulse{animation:none}

}

const aiNote = (match, note) => ({ id: uid('a'), match, note, status: 'open' });
function getCard(s, id) { return s.cards.find((c) => c.id === id) || null; }
function cardNo(s, c) { return s.cards.indexOf(c) + 1; }
function addEv(s, evs) {
  evs.forEach((e) => {
    const id = uid('e');
    s.timeline.push({ id, time: e.time, text: e.text, fork: !!e.fork });
    s.fresh.add(id);
  });
}
function newCard(s, id, f) {
  const c = Object.assign({ id, title: '', if: '', then: '', unless: [], clues: [], notClues: [], pitfalls: [], quotes: [], certainty: null, certSource: null, ai: [] }, f);
  s.cards.push(c);
  s.fresh.add(id);
  return c;
}
function hyposInto(c, hypos, ans) {
  hypos.forEach((h) => {
    const a = ans[h.id] || {};
    const fix = String(a.fix || '').trim();
    if (a.v === 'yes') c.clues.push(h.clue || h.text);
    else if (a.v === 'partly') {
      if (fix && h.fix && fix === h.fix) { c.clues.push(h.fixClue); c.quotes.push(fix); if (h.partlyNot) c.notClues.push(h.partlyNot); }
      else if (fix) { c.clues.push(fix); c.quotes.push(fix); }
      else c.clues.push((h.clue || h.text) + '（一部違う）');
    } else if (a.v === 'no') c.notClues.push(h.not || h.text);
  });
}

function rulesText(m) {

- テーマ: ${m.theme}
- 判断メモを受け取る人: ${m.successor}
- いま ${st.session} 回目

## 聞き方のきまり
1. 一般論や手順は聞かない。まず、テーマに当てはまる最近の具体的な1日（1件）を思い出してもらう。
2. その1件を時刻順に話してもらい、出来事を timeline_add に入れる。判断が起きた点は fork を true にする。変えなかったこと、しなかったことも聞く。
3. 分かれ目の理由を「なぜ？」と白紙で聞かない。そのとき見ていた手がかりの仮説を2〜3個 hypotheses に出し、正してもらう。仮説は互いに違う方向にする。
4. 仮説への答えのうち「そう」は clues、「少し違う」は本人の直しを clues と quotes、「違う」は not_clues に入れる。
5. 「${m.successor}ならどうすると思いますか」と対比で聞き、新人がやりがちなことを pitfalls に入れる。
6. unless（ただし）が空のカードがあれば「当てはまらない日はありますか」と聞く。unless が埋まったカードは ask_certainty_card にその id を入れ、確かさを聞く。そのとき hypotheses は [] にする。
7. 質問は1回に1つ、2文以内。です・ます調で短く。相手の言葉の繰り返しは最小限にする。
8. quotes は本人の発言からそのまま抜き出す。言い換えない。
9. 本人が言っていないことをカードに書いたら、その語句を ai_notes に {"match": カードの文中にある語句そのまま, "note": 何をどう補ったかと、確かめる問い} として必ず入れる。
10. カードが2〜3枚そろい、例外まで聞けたら ready_for_review を true にし、question は「最後に書き起こしを確かめてください」という案内にする。
11. 話し手がテーマから大きく外れたら、やさしくテーマの1件に戻す。`;

const OUTPUT_SPEC = `## 返し方

function markText(text, ais, numFn) {
  let segs = [{ t: String(text || ''), a: null }];
  ais.slice().sort((x, y) => y.match.length - x.match.length).forEach((a) => {
    if (!a.match) return;
    const next = [];
    segs.forEach((s) => {
      if (s.a) { next.push(s); return; }
      const parts = s.t.split(a.match);
      parts.forEach((p, i) => { if (p) next.push({ t: p, a: null }); if (i < parts.length - 1) next.push({ t: a.match, a }); });
    });
    segs = next;
  });
  return segs.map((s) => (s.a ? `<mark class="aim" data-ai="${s.a.id}"${numFn ? ' data-action="find-q"' : ''}>${esc(s.t)}${numFn ? `<sup>${numFn(s.a)}</sup>` : ''}</mark>` : esc(s.t))).join('');
}

function renderMsg(m) {

function memoAsText() {

    { ok: s.every((x) => !uiRe.test(x.action)), t: '行動に、ボタン名や操作の言葉が入っていない', d: `${s.filter((x) => !uiRe.test(x.action)).length} / ${s.length} ステップ` },

function focusMap() {
  if (!mapFocus) return;

  const cells = $$(`.map [data-col="${mapFocus}"]`);
  cells.forEach((el) => el.classList.add('hl'));
  const band = $('#mapband');
  const th = $('#mcol-' + mapFocus);
  if (band && th) {
    const rowh = $('.map .rowh');
    band.scrollLeft = Math.max(0, th.offsetLeft - (rowh ? rowh.offsetWidth : 0) - 8);

/* ---------- main render ---------- */

  $$('.viewswitch a').forEach((a) => { if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (view === 'map') {
    if (!mapRendered) { $('#view-map').innerHTML = renderMap(); mapRendered = true; }

    return;
  }
  const keepLog = $('#log') ? $('#log').scrollTop : 0;
  const keepQueue = $('.queue') ? $('.queue').scrollTop : 0;
  renderRailbar();
  const html = st.screen === 'invite' ? renderInvite()
    : st.screen === 'interview' ? renderInterview()
      : st.screen === 'resume' ? renderResume()
        : st.screen === 'review' ? renderReview()
          : renderDone();
  $('#screen').innerHTML = html;
  const log = $('#log');
  const queue = $('.queue');
  if (queue) queue.scrollTop = keepQueue;
  if (log && !st.scrollEnd) log.scrollTop = keepLog;
  if (log && st.scrollEnd) {
    log.scrollTop = log.scrollHeight;
    if (narrow()) { const c = $('.composer'); if (c) c.scrollIntoView({ block: 'nearest' }); }
    st.scrollEnd = false;
  }
  const la = st.screen === 'interview' ? lastAi() : null;
  if (la && la.id !== lastAnnounced) { $('#announce').textContent = '聞き手：' + la.text; lastAnnounced = la.id; }
  if (pendingFocus) {

/* ---------- actions ---------- */
function findCardAi(cid, aid) { const c = getCard(st, cid); return c ? [c, c.ai.find((a) => a.id === aid)] : [null, null]; }
function replaceInCard(c, from, to) {
  ['title', 'if', 'then'].forEach((k) => { c[k] = String(c[k]).split(from).join(to); });
  ['unless', 'clues', 'notClues', 'pitfalls'].forEach((k) => { c[k] = c[k].map((x) => String(x).split(from).join(to)); });
}
function pulse(el) { if (!el) return; el.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' }); el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }

const actions = {
  start() { jumpTo('S2'); window.scrollTo(0, 0); },
  reset() { st.confirmDiscard = false; jumpTo('S1'); window.scrollTo(0, 0); },
  'goto-step'(t) { const s = t.dataset.step; jumpTo(s); if (view !== 'prototype') location.hash = 'prototype'; window.scrollTo(0, 0); },
  'to-map-step'(t, e) { e.preventDefault(); mapFocus = t.dataset.step; if (location.hash === '#map') render(); else location.hash = 'map'; },
  'toggle-notes'() { ui.notes = !ui.notes; store.set(UKEY, ui); render(); },
  mtab(t) { st.mtab = t.dataset.tab; if (st.mtab === 'note') st.badgeSeen = st.fresh; render(); },
  hv(t) {
    const m = lastAi(); if (!m || !m.hypos) return;
    const h = m.hypos.find((x) => x.id === t.dataset.h); if (!h) return;
    h.v = t.dataset.v;
    if (h.v === 'partly') {
      if (!h.fix && st.mode === 'demo') { const b = BEATS[st.beat]; const src = b && b.hypos && b.hypos.find((x) => x.id === h.id); if (src && src.fix) h.fix = src.fix; }
      pendingFocus = '#fix-' + h.id;
    }
    render();
  },
  'send-hypos'() { sendHypos(false); },
  scale(t) { sendScale(t.dataset.v, false); },
  pause() { st.pausing = 'manual'; pendingFocus = '#memo'; render(); },
  'cancel-pause'() { st.pausing = false; render(); },
  resume() { doResume(); window.scrollTo(0, 0); render(); },
  'to-review'() { st.screen = 'review'; st.step = 'S7'; st.fixing = null; saveLive(); window.scrollTo(0, 0); render(); },
  'keep-talking'() { st.ready = false; render(); },
  'back-interview'() { st.screen = 'interview'; const b = st.mode === 'demo' ? BEATS[st.beat] : null; st.step = b ? b.step : (st.step === 'S7' ? 'S5' : st.step); st.scrollEnd = true; render(); },
  'back-review'() { st.screen = 'review'; st.step = 'S7'; window.scrollTo(0, 0); render(); },
  reader() { st.reader = !st.reader; render(); },
  'ai-ok'(t) { const [, a] = findCardAi(t.dataset.card, t.dataset.ai); if (a) { a.status = 'ok'; st.fixing = null; saveLive(); render(); } },
  'ai-fix'(t) { st.fixing = t.dataset.ai; pendingFocus = '#fx-' + t.dataset.ai; render(); },
  'fix-cancel'() { st.fixing = null; render(); },
  cert(t) { const c = getCard(st, t.dataset.card); if (c) { c.certainty = t.dataset.v; c.certSource = 'review'; saveLive(); render(); } },
  'find-ai'(t) { pulse($(`#doc mark[data-ai="${t.dataset.ai}"]`)); },
  'find-q'(t) { pulse($('#q-' + t.dataset.ai)); },
  handoff() { st.screen = 'done'; saveLive(); window.scrollTo(0, 0); render(); },
  'live-setup'() { st.liveSetup = true; pendingFocus = '#lf-theme'; render(); },
  'live-cancel'() { st.liveSetup = false; render(); },
  'live-continue'() {
    const o = loadLive(); if (!o) return;
    st = o;
    if (st.screen === 'interview' || st.screen === 'invite' || st.screen === 'resume') { if (!st.pausedAt) st.pausedAt = o.savedAt || Date.now(); st.pausing = false; st.screen = 'resume'; st.step = 'S6'; }
    window.scrollTo(0, 0); render();
  },
  'live-discard'() { if (!st.confirmDiscard) { st.confirmDiscard = true; render(); return; } store.del(LKEY); st.confirmDiscard = false; render(); },
  'to-demo'() { if (liveCtl) liveCtl.abort(); saveLive(); st = freshState('demo'); window.scrollTo(0, 0); render(); },
  stop() { if (liveCtl) liveCtl.abort(); },
  retry() { st.err = null; liveTurn(); },
  copy() {
    const text = memoAsText();
    const fallback = () => { const ta = $('#copytext'); if (ta) { ta.focus(); ta.select(); } st.copied = '選択しました。コピーしてお使いください'; const s = $('.donescr .status'); if (s) s.textContent = st.copied; };

      navigator.clipboard.writeText(text).then(() => { st.copied = 'コピーしました'; const s = $('.donescr .status'); if (s) s.textContent = st.copied; }, fallback);
    } catch (e) { fallback(); }
  },
};

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'draft') st.draft = t.value;
  else if (t.id === 'memo') st.memoDraft = t.value;
  else if (t.dataset.fix) { const m = lastAi(); const h = m && m.hypos && m.hypos.find((x) => x.id === t.dataset.fix); if (h) h.fix = t.value; }
  else if (t.dataset.lf) st.liveForm[t.dataset.lf] = t.value;
});
document.addEventListener('change', (e) => { if (e.target.dataset.rcp === 'b') st.rcpB = e.target.checked; });
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'draft' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); const f = e.target.form; if (f) f.requestSubmit(); }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  const kind = f.dataset.form;
  if (kind === 'answer') { const ta = $('#draft'); sendText(ta ? ta.value : st.draft, false); if (st.mode === 'demo') return; }
  else if (kind === 'pause') { const i = $('#memo'); doPause(i ? i.value.trim() : ''); window.scrollTo(0, 0); }
  else if (kind === 'live') { startLive(st.liveForm); return; }
  else if (kind === 'fix') {
    const [c, a] = findCardAi(f.dataset.card, f.dataset.ai);
    const val = ($('input', f) || {}).value;
    const nv = String(val || '').trim();
    if (c && a) {
      if (nv && nv !== a.match) { replaceInCard(c, a.match, nv); a.status = 'fixed'; a.fixed = nv; }
      else a.status = 'ok';
      st.fixing = null; saveLive();
    }
  }
  render();
});

setInterval(() => {
  const ts = $('#think-sec'); if (ts && st.thinkStart) ts.textContent = String(Math.round((Date.now() - st.thinkStart) / 1000));
  const el = $('#elapsed'); if (el) el.textContent = String(elapsedMin());
}, 1000);

function applyHash() {
  const h = (location.hash || '').replace('#', '');
  const nv = h === 'map' ? 'map' : 'prototype';
  const changed = nv !== view;
  const hadFocus = !!mapFocus;
  view = nv;
  render();
  if (changed && !hadFocus) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', applyHash);

function serial(s) { return Object.assign({}, s, { fresh: [], thinking: false }); }
function boot(data) {
  try {
    if (data && data.st && data.st.meta) { st = Object.assign(freshState(data.st.mode), data.st, { fresh: new Set(), thinking: false }); }
  } catch (e) { st = freshState('demo'); }
  const h = (location.hash || '').replace('#', '');
  view = h === 'map' ? 'map' : 'prototype';
  render();
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ st: serial(st) })); } catch (e) { /* not in a viewer */ }
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
